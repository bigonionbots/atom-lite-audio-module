; ATOM Lite audio module: an M5Stack ATOM Lite (ESP32-PICO-D4) that plays audio a host board
; streams to it, to Bluetooth A2DP headphones, a PCM5102A on I2S, or a null sink.
;
;   pio run -t upload          # the player (env atom_lite)
;
; The host talks protocol/AudioLinkProtocol.h over either transport, both always listening:
;   USB   the ATOM's USB-C port (UART0 through its USB bridge), AUDIO_MODULE_BAUD
;   UART  the Grove port, RX G32 / TX G26, AUDIO_MODULE_UART_BAUD (src/Config.h)
;
; The atom_* diagnostic envs are link tests on the USB port (src/LinkDiag.cpp, tools/).
;
; BRIDGE: this ATOM Lite's USB serial is an FTDI emulation ("Hades2001" / "M5stack",
; 0403:6001, bcdDevice 5.00), not an FTDI chip. 921600 and 1M come out garbled, 500k/750k/1.5M are
; bit-clean (README).
[platformio]
default_envs = atom_lite

[env:atom_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
framework = arduino
board = m5stack-atom
; 3 MB app, no OTA: Bluetooth Classic + both decoders do not fit the default 1.25 MB slot.
board_build.partitions = huge_app.csv
upload_speed = 1500000
monitor_speed = 500000
build_flags =
  -Iprotocol
  -DAUDIO_MODULE_BAUD=500000
  ; Grove UART link; set a pin to -1 to leave it out.
  -DAUDIO_MODULE_UART_RX=32
  -DAUDIO_MODULE_UART_TX=26
  -DAUDIO_MODULE_UART_BAUD=500000
  ; No HE-AAC (SBR): its 51 KB state does not fit next to Bluetooth Classic on this PSRAM-less
  ; ESP32 (README). HE-AAC files play as their AAC-LC core. lib/libhelix is a vendored, patched
  ; codec-helix (lib/libhelix/PATCHES.md).
  -DHELIX_NO_AAC_SBR
  -DHELIX_LOGGING_ACTIVE=false
build_src_filter = +<*>
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

; One-direction link test on the USB port, driven by a host's link test or tools/link_diag.py.
[env:atom_linkdiag]
extends = env:atom_lite
build_flags =
  -Iprotocol
  -DAUDIO_MODULE_BAUD=500000
  -DAUDIO_MODULE_DIAG_MODE=3
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Plain echo, for tools/echo_test.py from a PC.
[env:atom_echo]
extends = env:atom_lite
build_flags =
  -Iprotocol
  -DAUDIO_MODULE_BAUD=500000
  -DAUDIO_MODULE_DIAG_MODE=1
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Experiments at any baud rate: AUDIO_MODULE_BAUD=750000 pio run -e atom_diag -t upload
[env:atom_diag]
extends = env:atom_lite
build_flags =
  -Iprotocol
  -DAUDIO_MODULE_BAUD=${sysenv.AUDIO_MODULE_BAUD}
  -DAUDIO_MODULE_DIAG_MODE=3
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>

; Transmit-only text beacon at any baud rate, to find the real transmit rate from the PC.
[env:atom_beacon]
extends = env:atom_lite
build_flags =
  -Iprotocol
  -DAUDIO_MODULE_BAUD=${sysenv.AUDIO_MODULE_BAUD}
  -DAUDIO_MODULE_DIAG_MODE=2
lib_deps =
lib_ignore = libhelix
build_src_filter = -<*> +<main.cpp> +<LinkDiag.cpp>
